[package]
name = "agent-desk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent_desk_core = { version = "0.1.0", path = "../core" }
async-channel = "2.5.0"
gpui-kit = "0.11.0"
log = "0.4.35"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", default-features = false, features = ["rt"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
agent_desk_test_support = { path = "../test-support" }
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3.27.0"
